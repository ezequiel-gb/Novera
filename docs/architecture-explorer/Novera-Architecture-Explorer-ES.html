</style></head><body><noscript>Activa JavaScript para explorar este diagrama sin conexión.</noscript><script>(()=>{var Z=[["novera_open_dashboard","Open the workspace","Abrir el espacio de trabajo","Shows the interactive directory, company profiles and pipeline.","Muestra el directorio interactivo, las fichas y el seguimiento comercial.",!0],["novera_list_companies","Find saved companies","Buscar empresas guardadas","Finds saved records by company name, locality and stage.","Encuentra registros guardados por nombre de empresa, localidad y etapa.",!0],["novera_get_company","Read a company","Consultar una empresa","Returns contacts, sources, notes, versions and recent history.","Devuelve contactos, fuentes, notas, versiones e historial reciente.",!0],["novera_create_company","Create a company","Crear una empresa","Checks possible duplicates, then saves an explicitly requested record.","Comprueba posibles duplicados y guarda el registro solicitado.",!1],["novera_update_company","Update a company","Actualizar una empresa","Changes company fields or nested contacts only when the expected version and hash match.","Cambia datos o contactos de la empresa si coinciden la versi\xF3n y la huella esperadas.",!1],["novera_archive_company","Archive safely","Archivar con recuperaci\xF3n","Requires confirmation; retains contacts and documents rather than permanently deleting them.","Requiere confirmaci\xF3n; conserva contactos y documentos en lugar de borrarlos definitivamente.",!1],["novera_restore_company","Unarchive a company","Recuperar una empresa archivada","Makes an archived record active again, retaining its current information.","Vuelve a activar un registro archivado y conserva su informaci\xF3n actual.",!1],["novera_save_research","Save research notes","Guardar notas de investigaci\xF3n","Replaces the research document after checking both company and document versions.","Sustituye el documento de investigaci\xF3n tras comprobar las versiones de empresa y documento.",!1],["novera_add_interaction","Record a conversation","Registrar una conversaci\xF3n","Adds a dated note with the supplied author to the company history.","A\xF1ade una nota fechada con el autor indicado al historial de la empresa.",!1],["novera_get_sync_status","Check availability","Comprobar disponibilidad","Reports the active storage mode and any pending recovery operations.","Informa del modo de almacenamiento y de las operaciones de recuperaci\xF3n pendientes.",!0],["novera_get_operation","Check an uncertain save","Comprobar un guardado dudoso","Finds the original result by operation key before an interrupted request is retried.","Busca el resultado original por su clave antes de repetir una solicitud interrumpida.",!0],["novera_restore_snapshot","Restore reviewed backup","Restaurar una copia revisada","Restores the selected operation\u2019s available previous content, creating a new revision.","Restaura el contenido anterior disponible de una operaci\xF3n revisada y crea una nueva revisi\xF3n.",!1],["novera_export_data","Export private records","Exportar registros privados","Returns active and archived records, including contacts and notes, after confirmation.","Devuelve registros activos y archivados, incluidos contactos y notas, tras confirmar.",!0],["novera_rebuild_index","Rebuild the index","Reconstruir el \xEDndice","Rebuilds the derived search index from valid company records.","Reconstruye el \xEDndice de b\xFAsqueda derivado a partir de registros v\xE1lidos.",!1]],de=[["user","host",[-620,50,0],"Your request","Tu solicitud","You decide what to research, save or change.","T\xFA decides qu\xE9 investigar, guardar o cambiar.","User-directed research and relationship decisions."],["chat","host",[-390,50,0],"ChatGPT","ChatGPT","Researches and reasons with the tools available in your conversation, then asks Novera to manage records.","Investiga y analiza con las herramientas disponibles en tu conversaci\xF3n y pide a Novera que gestione los registros.","ChatGPT host reasoning and tool selection."],["web","host",[-390,-190,-130],"External research","Investigaci\xF3n externa","You and GPT can review company websites and public sources, then save selected references and findings in Novera.","T\xFA y GPT pod\xE9is consultar webs de empresas y fuentes p\xFAblicas, y guardar en Novera las referencias y conclusiones elegidas.","Research uses the assistant\u2019s available web tools; Novera stores the reviewed references and notes."],["tunnel","runtime",[-160,50,0],"Private connection","Conexi\xF3n privada","Carries requests between ChatGPT and your computer without opening a public Novera server.","Transporta solicitudes entre ChatGPT y tu ordenador sin abrir un servidor p\xFAblico de Novera.","tools/tunnel-client: outbound HTTPS \u2192 local stdio; existing endpoint retained."],["server","mcp",[70,50,0],"Novera MCP server","Servidor MCP de Novera","A small local service understands requests to find, save and update information.","Un servicio local entiende las solicitudes para buscar, guardar y actualizar informaci\xF3n.","server/main.mjs \u2192 server/mcp.mjs; official SDK; 14 tools."],["validation","mcp",[70,250,-100],"Checks before saving","Comprobaciones previas","Checks formats, duplicate candidates and expected versions before accepting changes.","Comprueba formatos, posibles duplicados y versiones antes de aceptar cambios.","shared/schema.mjs; strict Zod validation plus Store revision and content-fingerprint checks."],["store","data",[300,50,0],"Local record store","Almac\xE9n local","Saves requested information as readable files in a dedicated Novera folder on your computer.","Guarda la informaci\xF3n solicitada en archivos legibles dentro de una carpeta propia de Novera.","server/store.mjs; approved Projects/Novera; JSON/Markdown; live/test root selection."],["records","data",[540,50,50],"Companies and contacts","Empresas y contactos","Company details, professional contacts, evidence, priority, next action and stage stay together.","Los datos de empresa, contactos profesionales, pruebas, prioridad, siguiente acci\xF3n y etapa se guardan juntos.","company.json; nested contact IDs; validated relationship and pipeline fields."],["documents","data",[540,250,-90],"Research and interactions","Investigaci\xF3n e interacciones","Longer research and dated conversation notes sit beside each company record.","Las notas de investigaci\xF3n y las conversaciones fechadas acompa\xF1an a cada registro.","research.md replace; interactions.md append; independent document hashes."],["recovery","data",[300,250,-100],"Versions and recovery","Versiones y recuperaci\xF3n","Rejects stale edits, records safe retries and keeps previous changed files for reviewed recovery.","Rechaza cambios obsoletos, registra reintentos seguros y conserva versiones anteriores para recuperarlas tras revisarlas.","Store: .lock, .pending, .audit, .operations, .backups; 256MiB backup cap."],["dashboard","ui",[70,-190,110],"Interactive dashboard","Panel interactivo","Overview, directory, pipeline and company profiles use the same records as conversational tools.","El resumen, directorio, seguimiento comercial y fichas usan los mismos registros que las herramientas de conversaci\xF3n.","apps/widget: React; UI bridge \u2192 same tools; volatile drafts; ES/EN and themes."],["startup","runtime",[-390,440,100],"Windows sign-in","Inicio de sesi\xF3n de Windows","Two Novera tasks start the connection controls for the signed-in user. A key is still needed locally.","Dos tareas de Novera abren los controles para el usuario que inicia sesi\xF3n. La clave sigue siendo necesaria en el equipo.","Limited interactive logon tasks: runtime and panel; no unattended secret storage."],["python","runtime",[-160,440,100],"Novera-owned Python","Python propio de Novera","Runs the local connection windows and supervisor from Novera\u2019s own folder.","Ejecuta las ventanas de conexi\xF3n y la supervisi\xF3n desde la carpeta propia de Novera.","tools/python: official CPython + Tk; no Celious interpreter; deployment evidence in runtime report."],["key","runtime",[-160,250,180],"Masked key window","Ventana de clave oculta","You enter the existing key locally. It is held in memory, so rebooting requires entry again.","Introduces la clave existente en el equipo. Se conserva en memoria y hay que volver a introducirla tras reiniciar.","connect_tunnel.py: Tk masked Entry; env reference; no secret in this explorer."],["supervisor","runtime",[70,440,100],"Connection supervisor","Supervisor de conexi\xF3n","Monitors the runtime and reconnects a confirmed stopped child. An uncertain diagnostic does not launch duplicates.","Vigila el proceso y reconecta un hijo confirmado como detenido. Un diagn\xF3stico dudoso no crea duplicados.","runtime_supervisor.py: status10s; only process_running=false triggers connect."],["panel","ui",[300,440,100],"Desktop connection panel","Panel de conexi\xF3n del escritorio","Shows fresh health, diagnostics and redacted logs. Hiding the window keeps supervision running.","Muestra el estado reciente, diagn\xF3sticos y registros con claves ocultas. Ocultarlo mantiene la supervisi\xF3n.","control_panel.py: fresh<45s + process/healthy/ready; separate from commercial dashboard."],["celious","celious",[-390,-390,260],"Celious file workspace","Espacio de archivos Celious","An optional, separately connected assistant workspace for files and folders you authorise, with its own records and permissions.","Un espacio de trabajo opcional del asistente, conectado por separado, para los archivos y carpetas que autorices, con sus propios datos y permisos.","Independent Celious MCP integration with its own runtime, credentials, records and authorised folders."],["localfiles","celious",[-100,-390,260],"Authorised local files","Archivos locales autorizados","GPT can ask Celious to work with a document in an authorised folder, then discuss findings with you.","GPT puede pedir a Celious que trabaje con un documento de una carpeta autorizada y despu\xE9s comentar los hallazgos contigo.","Celious-scoped filesystem operations; no direct Novera-to-Celious or Novera-to-file edge."]],ue=[["user","chat"],["chat","web"],["chat","tunnel"],["tunnel","server"],["server","validation"],["validation","store"],["server","store"],["store","records"],["store","documents"],["store","recovery"],["chat","dashboard"],["dashboard","server"],["startup","python"],["python","key"],["python","panel"],["python","supervisor"],["key","supervisor"],["supervisor","tunnel"],["chat","celious"],["celious","localfiles"]],R=[{en:"Research an opportunity",es:"Investigar una oportunidad",steps:[["user","Ask to assess a possible business opportunity.","Pide valorar una posible oportunidad de negocio."],["web","GPT or you consult public sources, compare evidence and note uncertainty.","GPT o t\xFA consult\xE1is fuentes p\xFAblicas, compar\xE1is pruebas y anot\xE1is la incertidumbre."],["chat","Review observations and hypotheses before deciding what belongs in a record.","Revisa observaciones e hip\xF3tesis antes de decidir qu\xE9 incluir en un registro."],["server","Request a company record with its source references and duplicate check.","Solicita un registro de empresa con referencias y comprobaci\xF3n de duplicados."],["store","Novera saves the approved structured record locally.","Novera guarda localmente el registro estructurado aprobado."]]},{en:"Record a company and contacts",es:"Registrar una empresa y sus contactos",steps:[["chat","Choose the company details and professional contact information to retain.","Elige los datos de empresa y de contacto profesional que quieras conservar."],["validation","Check required fields, contact IDs and the current company version.","Comprueba los campos obligatorios, los identificadores de contacto y la versi\xF3n actual."],["server","Submit the explicitly requested create or update operation.","Env\xEDa la operaci\xF3n de creaci\xF3n o actualizaci\xF3n solicitada expresamente."],["store","Save the company and nested contacts in the same local record.","Guarda la empresa y sus contactos asociados en el mismo registro local."],["dashboard","Open the profile to review what was saved.","Abre la ficha para revisar lo guardado."]]},{en:"Review information and sources",es:"Revisar la informaci\xF3n y sus fuentes",steps:[["records","Open a saved company record.","Abre un registro de empresa guardado."],["documents","Review research notes, source references, facts and hypotheses.","Revisa las notas, las referencias, los hechos y las hip\xF3tesis."],["chat","Ask GPT to summarise the material while keeping uncertainty visible.","Pide a GPT que resuma el material y mantenga visible la incertidumbre."],["user","Decide whether the evidence supports a next step.","Decide si las pruebas justifican dar el siguiente paso."]]},{en:"Plan a commercial follow-up",es:"Planificar un seguimiento comercial",steps:[["records","Review the relationship and current pipeline stage.","Revisa la relaci\xF3n y la etapa actual del seguimiento."],["documents","Record a dated interaction or set a next action and date.","Registra una interacci\xF3n fechada o define una pr\xF3xima acci\xF3n y su fecha."],["dashboard","Review the prioritised queue and pipeline.","Revisa la cola priorizada y el seguimiento comercial."],["user","Choose and carry out the next action yourself; no message or reminder is sent.","Elige y realiza t\xFA la siguiente acci\xF3n; no se env\xEDan mensajes ni avisos."]]},{en:"Continue in a later GPT conversation",es:"Continuar en otra conversaci\xF3n con GPT",steps:[["user","Return later and ask about the work already recorded.","Vuelve m\xE1s adelante y pregunta por el trabajo registrado."],["chat","GPT calls Novera instead of relying on an old chat being present.","GPT consulta Novera sin depender de que siga disponible una conversaci\xF3n anterior."],["server","Use the company list or detail tool.","Usa la herramienta de lista o consulta de empresa."],["store","Retrieve the persistent record and its research documents.","Recupera el registro persistente y sus documentos de investigaci\xF3n."],["chat","Continue the discussion using the returned context.","Contin\xFAa la conversaci\xF3n con el contexto recuperado."]]},{en:"Combine Novera and Celious",es:"Combinar Novera y Celious",steps:[["chat","Ask GPT to review a business question and an existing document.","Pide a GPT revisar una cuesti\xF3n comercial y un documento existente."],["server","Novera supplies its saved company context through its own MCP connection.","Novera aporta el contexto guardado de la empresa mediante su propia conexi\xF3n MCP."],["chat","With your authorisation, GPT separately asks Celious to open a permitted file.","Con tu autorizaci\xF3n, GPT pide por separado a Celious que abra un archivo permitido."],["celious","Celious applies its own folder permissions and returns the requested file information.","Celious aplica sus propios permisos de carpeta y devuelve la informaci\xF3n solicitada."],["localfiles","You review the document findings and decide whether they are relevant.","Revisas los hallazgos del documento y decides si son pertinentes."],["chat","GPT helps compare both sources; you explicitly request any Novera update.","GPT ayuda a comparar ambas fuentes; cualquier actualizaci\xF3n en Novera la solicitas expresamente."]]},{en:"Protect a change",es:"Proteger un cambio",steps:[["dashboard","Edit a temporary draft; it is not saved yet.","Edita un borrador temporal; todav\xEDa no se ha guardado."],["validation","Compare the expected revision and exact content fingerprint.","Compara la revisi\xF3n esperada y la huella exacta del contenido."],["recovery","If the record changed, report a conflict and preserve the draft for review.","Si el registro ha cambiado, informa del conflicto y conserva el borrador para revisarlo."],["server","Submit the reviewed version with a new operation key.","Env\xEDa la versi\xF3n revisada con una clave de op
